[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightrp"
version = "0.1.0"
description = "Lightweight multi-character RP engine with Hermes-style memory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ZUENS2020" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lightrp = "lightrp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lightrp = ["prompts/**/*", "data/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
