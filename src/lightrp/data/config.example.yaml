# Copy to ~/.lightrp/config.yaml, or edit everything in the Web UI (设置).
# 密钥可写在下面 api_key，也可只用环境变量 LIGHT_RP_API_KEY / OPENAI_API_KEY。

llm:
  base_url: ""          # OpenAI 兼容根路径，例如 https://api.example.com/v1
  model: ""
  api_key_env: LIGHT_RP_API_KEY
  temperature: 0.85
  max_tokens: 2048
  timeout: 120
  breach: true          # R18G 破甲；设 false 关闭

nmem:
  enabled: true
  space: ""          # set a space name/id, or pass --space / world.yaml nmem_space
  binary: nmem

memory:
  world_char_limit: 2500
  player_char_limit: 1400
  character_char_limit: 1200

compact_after_turns: 40
lore_scan_depth: 4
lore_token_budget: 2048
max_tool_rounds: 4
transcript_keep_after_compact: 8

context:
  max_tokens: 32768
  generation_reserve: 4096
  tool_reserve: 1500
  memory_split:
    world: 0.6
    player: 0.4
  budget:
    system: 1500
    world: 2500
    user_setting: 1500
    primary_card: 4000
    mini_cards: 1200
    lore: 3000
    state: 800
    memory: 2500
    nmem: 2500
    summary: 2500
  history:
    use_remaining: true
    protect_recent_turns: 6

mini:
  max_tokens: 1200
  recent_turns: 4
  max_characters: 6
